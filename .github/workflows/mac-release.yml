name: Mac agent release
run-name: Mac release ${{ inputs.version }} ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Mac release number N for version 2.0.N.0 (must not go backwards)'
        required: true
        type: string
      request_id:
        description: 'Build-Release correlation ID (leave blank for manual runs)'
        required: false
        type: string
      sdk:
        description: '.NET SDK version'
        default: '10.0.x'
        type: string
permissions:
  contents: read
concurrency:
  group: mac-agent-release
  cancel-in-progress: false
jobs:
  sign:
    runs-on: macos-15
    environment:
      name: release
      deployment: false
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.sdk }}
      - name: Build Mac agent
        shell: pwsh
        env:
          RELEASE_NUMBER: ${{ inputs.version }}
        run: |
          if ($env:RELEASE_NUMBER -notmatch '^[1-9][0-9]{0,4}$') { throw 'Enter a release number from 1 to 65534.' }
          ./Build/Build-MacAgent.ps1 -Version ([int]$env:RELEASE_NUMBER) -NoUpdateReleaseState
      - name: Sign and notarize
        shell: bash
        env:
          MAC_APPLICATION_P12_BASE64: ${{ secrets.MAC_APPLICATION_P12_BASE64 }}
          MAC_APPLICATION_P12_PASSWORD: ${{ secrets.MAC_APPLICATION_P12_PASSWORD }}
          MAC_INSTALLER_P12_BASE64: ${{ secrets.MAC_INSTALLER_P12_BASE64 }}
          MAC_INSTALLER_P12_PASSWORD: ${{ secrets.MAC_INSTALLER_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: bash Build/Sign-MacGitHub.sh
      - name: Downloadable signed release
        uses: actions/upload-artifact@v4
        with:
          name: CloneDeploy-Mac-2.0.${{ inputs.version }}.0
          # Temporary handoff; Get-GitHubMacRelease deletes this after local verification.
          retention-days: 1
          if-no-files-found: error
          path: |
            artifacts/mac-agent/CloneDeploy-Agent-macOS-arm64.pkg
            artifacts/mac-agent/release.json
      - name: Notarization diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-notarization-diagnostics
          retention-days: 1
          if-no-files-found: ignore
          path: ${{ runner.temp }}/clonedeploy-mac-sign/*notarization.json
